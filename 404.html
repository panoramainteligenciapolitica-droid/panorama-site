<title>Panorama Inteligência Política</title>
<script>
  // Endereços antigos (do site anterior) levam para a página inicial, na seção mais próxima
  (function () {
    var p = location.pathname.toLowerCase();
    var mapa = [['contato', 'contato'], ['fale', 'contato'], ['sobre', 'quem-somos'], ['quem', 'quem-somos'], ['servic', 'servicos'], ['setor', 'setores']];
    var alvo = '';
    for (var i = 0; i < mapa.length; i++) if (p.indexOf(mapa[i][0]) > -1) { alvo = '#' + mapa[i][1]; break; }
    location.replace('/' + alvo);
  })();
</script>
